# Dependabot の更新 PR を自動でマージする。
# - パッチ・マイナーの更新だけを対象にし、メジャーの更新は手動で確認する（互換性が壊れることがあるため）
# - GitHub の auto-merge を使い、ブランチ保護で必須にした CI がすべて通った時点でマージされる
# - 公開直後の版を避ける決まり（2週間）は、dependabot.yml の cooldown で守る（docs/07 4.2）
# 前提: Settings → General → Pull Requests →「Allow auto-merge」を有効にしておく
#
# Dependabot 以外の PR を自動でマージしないよう、次をすべて確認する
# - PR の作成者と、ワークフローを動かした人（actor）が、どちらも dependabot[bot] である
# - PR のブランチがこのリポジトリのもの（フォークではない）。フォークからの PR は読み取り専用のトークンで動くため、
#   ワークフローを書き換えられてもマージはできない
# - PR のすべてのコミットが Dependabot のもの（人がコミットを足した PR は自動でマージしない）
name: dependabot-automerge

on:
  # PR が作られたら、すぐに auto-merge を有効にする
  pull_request:
    types: [opened, reopened, synchronize]
  # 取りこぼした PR（失敗した実行や、条件を変えたあとの既存の PR）を毎日拾う
  schedule:
    - cron: "17 0 * * *" # 毎日 09:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number || 'schedule' }}
  cancel-in-progress: false

jobs:
  # PR ごと（Dependabot の PR のときだけ動く）
  on-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'masuzuki1028/saigai-portal' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - id: commits
        name: すべてのコミットが Dependabot のものか確認する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          others=$(gh api "repos/$REPO/pulls/$NUM/commits" --paginate --jq '[.[] | select(.author.login != "dependabot[bot]")] | length')
          echo "others=$others" >> "$GITHUB_OUTPUT"
          if [ "$others" != "0" ]; then
            echo "Dependabot 以外のコミットが含まれるため、自動でマージしません" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: パッチ・マイナーの更新なら auto-merge を有効にする
        if: >-
          steps.commits.outputs.others == '0' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: メジャーの更新は手動で確認する
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "メジャーの更新（${{ steps.meta.outputs.dependency-names }}）は自動でマージしません。変更内容を確認してからマージしてください。" >> "$GITHUB_STEP_SUMMARY"

  # 毎日、開いている Dependabot の PR を見直す
  sweep:
    if: github.event_name != 'pull_request' && github.repository == 'masuzuki1028/saigai-portal'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: パッチ・マイナーの更新の PR に auto-merge を有効にする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # タイトルの「from X to Y」で更新の種類を判断する（例: Bump next from 16.4.2 to 16.4.3）
          gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number,title,autoMergeRequest,headRepositoryOwner \
            --jq '.[] | select(.autoMergeRequest == null and .headRepositoryOwner.login == env.OWNER) | [.number, .title] | @tsv' |
          while IFS=$'\t' read -r num title; do
            # 人がコミットを足した PR は自動でマージしない
            others=$(gh api "repos/$REPO/pulls/$num/commits" --paginate --jq '[.[] | select(.author.login != "dependabot[bot]")] | length')
            if [ "$others" != "0" ]; then
              echo "#$num: Dependabot 以外のコミットが含まれるため手動で確認"
              continue
            fi
            from=$(printf '%s' "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\1/p')
            to=$(printf '%s' "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\2/p')
            if [ -n "$from" ] && [ "$from" = "$to" ]; then
              echo "#$num: $title → auto-merge"
              gh pr merge --repo "$REPO" --auto --squash "$num" || echo "#$num: auto-merge を有効にできなかった（競合など）"
            else
              echo "#$num: $title → メジャーの更新か、複数の依存をまとめた PR のため手動で確認"
            fi
          done
