# PR と main への push で、テスト・静的解析・脆弱性検査と terraform plan を行う（docs/06_deploy_flow.md 5.1、docs/08_test_strategy.md 7章）。
# 外部の Action はコミット SHA で固定する（docs/07_security.md 4.2）。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./... && go vet -tags integration ./... && go vet -tags local ./...
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.14.0
          working-directory: api
      - name: 生成したコードに差分がないこと
        run: go generate ./internal/apigen && git diff --exit-code -- internal/apigen
      - name: ローカル専用のコードが通常のビルドに含まれないこと
        run: |
          if go list -deps ./... | grep -E 'internal/localenv|cmd/(local|replay)'; then
            echo "ビルドタグ local のコードが通常のビルドに含まれている" >&2
            exit 1
          fi
      - run: go test -race -cover ./...
      - name: Lambda のビルド（arm64）
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...
      - name: ファジング（seed のみ）
        run: go test ./internal/jma -run FuzzParse
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  api-integration:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: 結合・認可・災害シナリオのテスト（DynamoDB Local）
        run: go test -tags integration -race ./...
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: 生成した型に差分がないこと
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 開発用ツールには修正版のない脆弱性があるため、本番で使う依存だけを検査する。
      # 開発用ツールは dependency-review と Dependabot で追う
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: E2E（モック API）
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tfver
        run: echo "version=$(cat infra/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/bootstrap infra/envs/prod; do
            terraform -chdir="$d" init -backend=false -input=false -no-color > /dev/null
            terraform -chdir="$d" validate -no-color
          done
      # tflint・trivy はコンテナのイメージをダイジェストで固定して使う
      - name: tflint
        run: docker run --rm -v "$PWD/infra:/data" ghcr.io/terraform-linters/tflint@sha256:2c23953d05388157922a76be1a5a767ff719cba029e026914f92604e665b0d31 --recursive # v0.59.1
      - name: trivy config
        run: docker run --rm -v "$PWD/infra:/src:ro" aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e config --severity HIGH,CRITICAL --exit-code 1 --quiet /src # v0.66.0

  # 本番（prod）の plan。読み取り専用のロールで行い、件数だけをジョブの要約に出す（全文はログに出さない）。
  # フォークと Dependabot の PR には Secrets が渡らないため実行しない
  plan:
    needs: infra
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tf-plan-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
      - id: tfver
        run: echo "version=$(cat infra/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - name: terraform plan（件数だけを要約に出す）
        run: .github/scripts/tf-plan.sh infra/envs/prod -lock=false
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_VARS: ${{ secrets.TF_VARS_PROD }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
