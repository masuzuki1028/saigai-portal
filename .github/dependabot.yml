# 依存の自動更新（docs/07_security.md 4.2）。
# 公開直後の悪意あるバージョンを避けるため、cooldown で公開から14日経ってから更新の PR を作る（セキュリティ修正は除く）
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    cooldown: { default-days: 14 }
    groups:
      aws-sdk: { patterns: ["github.com/aws/*"] }
      # oapi-codegen は OpenAPI の読み込みに kin-openapi を使い、版によって生成したコードが変わる。
      # この更新の PR は「生成したコードに差分がないこと」で落ちることがあるため、手元で
      # go generate ./internal/apigen をしてからコミットする（自動ではマージされない）
      openapi: { patterns: ["github.com/getkin/kin-openapi", "github.com/oapi-codegen/*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    cooldown: { default-days: 14 }
    groups:
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "playwright-core", "@axe-core/playwright", "jsdom", "msw"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint"]
      # react-dom は同じ版の react を必要とするため、別々に上げると npm ci が失敗する
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
    ignore:
      # TypeScript 7 は Go で作り直された版。Next.js・typescript-eslint の対応を確かめてから手で上げる
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # 実行環境の Node（web/.nvmrc）のメジャーに合わせる。Node を上げるときに手で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    cooldown: { default-days: 14 }
